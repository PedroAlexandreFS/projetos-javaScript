<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/index.css">
    <title>Formatador de whatsapp</title>
</head>
<body>
    <main class="card">
        <h1>Formatador de whatsapp</h1>
    <input id="texto" type="text" placeholder="Digite o texto">
    <button id="btn-copia">copia</button>
    <p id="resultado-formatacao"></p>
    <p>tipo de formatação</p>
    <select id="formatacao">
        <option value="*">Negrito</option>
        <option value="_">Itálico</option>
        <option value="~">tachado</option>
        <option value="```">Monoespaçada</option>
    </select>
    </main>
    
    <script src="js/index.js"></script>
</body>
</html>
