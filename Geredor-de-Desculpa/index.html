<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/index.css">
    <title>Gerador de desculpa</title>
</head>

<body>
    <header>
        <!-- <== TOPO DA PÁGINA ==> -->
        <h1>Gerador de desculpa dev</h1>
        <p>Click no botão para gerar a desculpa para algum bug!</p>
    </header>
    <main>
        <!-- <== CONTEUDO PRINCIPAL ==> -->
        <section id="container-roleta">
            <div class="janela-roleta" id="roleta-culpado"></div>
            <div class="janela-roleta" id="roleta-acao"></div>
            <div class="janela-roleta" id="roleta-motivo"></div>
        </section>
        <!-- <== BOTÃO PARAGIRAR A ROLETA ==> -->
        <button id="btn-roleta">Girar a roleta</button>
        <button id="btn-dark">Dark mode</button>
    </main>
    <footer>
        <P>Site feito por PedroAlexandreFS</P>
        <P>link para meu <a target="_blank" href="https://github.com/PedroAlexandreFS"> github</a></p>

    </footer>
    <script src="js/index.js"></script>
</body>

</html>
